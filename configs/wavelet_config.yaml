wavelet_transform:
  transform_type: swt
  wavelet_family: db4
  levels: 5
  padding_method: reflect
  short: D1 + D2
  seasonal: D3
  long: D4 + D5 + A5
gap_policy:
  max_interpolation_gap_months: 2
  minimum_segment_months: 24
products:
  atlas:
    file: data/processed/basin_dataset_wavelet_multiscale.parquet
    definition: full-record retrospective SWT; no train/val/test boundaries
    use: continuous atlas, clustering, physical interpretation, trajectories, transitions
  evaluation:
    file: data/processed/basin_dataset_wavelet_multiscale_eval.parquet
    definition: SWT performed independently inside train/val/test blocks
    use: autoencoder train/validation/test reconstruction evaluation
variables:
- e_anomaly_normalized
- lai_hv_anomaly_normalized
- lai_lv_anomaly_normalized
- lwe_thickness_anomaly_normalized
- pev_anomaly_normalized
- sro_anomaly_normalized
- ssro_anomaly_normalized
- swvl1_anomaly_normalized
- swvl2_anomaly_normalized
- swvl3_anomaly_normalized
- swvl4_anomaly_normalized
- tp_anomaly_normalized
